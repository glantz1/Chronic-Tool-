<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracking & Intervention Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- Top Navigation Bar -->
    <nav class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-line text-indigo-400 text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Attendance Tracker</h1>
            </div>
            <div id="userInfo" class="hidden items-center space-x-4">
                <span id="userEmail" class="text-sm text-slate-300"></span>
                <span id="userRoleBadge" class="text-xs px-2 py-1 bg-indigo-600 text-white rounded font-semibold uppercase"></span>
                <button onclick="logout()" class="text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded transition border border-slate-700">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 py-8">

        <!-- LOGIN FORM SECTION -->
        <div id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-lg border border-slate-200 mt-12">
            <h2 class="text-2xl font-bold text-center text-slate-900 mb-6">Sign In</h2>
            <div id="loginError" class="hidden bg-red-50 text-red-700 p-3 rounded mb-4 text-sm border border-red-200"></div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                    <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow">
                    Sign In
                </button>
            </form>
        </div>

        <!-- MAIN DASHBOARD CONTAINER -->
        <div id="dashboardSection" class="hidden space-y-8">

            <!-- ADMIN MANAGEMENT PANEL (VISIBLE ONLY TO ADMINS) -->
            <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow border border-indigo-100 space-y-6">
                <div class="border-b pb-3 flex items-center space-x-2">
                    <i class="fa-solid fa-user-shield text-indigo-600 text-xl"></i>
                    <h2 class="text-lg font-bold text-slate-900">Admin Control Center</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- ADD SCHOOL FORM -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-3 flex items-center">
                            <i class="fa-solid fa-school mr-2 text-indigo-500"></i> Add New School
                        </h3>
                        <form onsubmit="handleAddSchool(event)" class="flex gap-2">
                            <input type="text" id="newSchoolName" placeholder="e.g., Lincoln High School" required class="flex-1 px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                                Add
                            </button>
                        </form>
                    </div>

                    <!-- ADD STAFF MEMBER FORM -->
                    <div class="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <h3 class="font-bold text-slate-800 mb-3 flex items-center">
                            <i class="fa-solid fa-user-plus mr-2 text-indigo-500"></i> Add New Staff Member
                        </h3>
                        <form onsubmit="handleAddUser(event)" class="space-y-3">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <input type="email" id="newUserEmail" placeholder="Staff Email" required class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                                <input type="password" id="newUserPassword" placeholder="Password" required class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                <select id="newUserRole" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                                    <option value="staff">Staff Role</option>
                                    <option value="admin">Admin Role</option>
                                </select>
                                <select id="newUserSchool" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                                    <option value="">Assign School...</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-semibold transition">
                                Create Staff Account
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- CONTROLS & UPLOAD SECTION -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Select School -->
                <div class="bg-white p-5 rounded-xl shadow border border-slate-200">
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Select Active School</label>
                    <select id="schoolSelect" onchange="loadStudents()" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500">
                        <option value="">Select a School...</option>
                    </select>
                </div>

                <!-- CSV Upload -->
                <div class="bg-white p-5 rounded-xl shadow border border-slate-200 md:col-span-2">
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-2">Import Attendance CSV File</label>
                    <form onsubmit="handleFileUpload(event)" class="flex gap-2">
                        <input type="file" id="csvFile" accept=".csv, .xlsx, .xls" required class="flex-1 text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <button type="submit" class="bg-slate-800 hover:bg-slate-900 text-white px-5 py-2 rounded-lg text-sm font-semibold transition flex items-center">
                            <i class="fa-solid fa-file-import mr-2"></i> Upload Data
                        </button>
                    </form>
                </div>
            </div>

            <!-- SEARCH & FILTER BAR -->
            <div class="bg-white p-4 rounded-xl shadow border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex flex-wrap gap-3 items-center flex-1">
                    <input type="text" id="searchInput" oninput="loadStudents()" placeholder="Search by student name or ID..." class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 min-w-[240px]">
                    
                    <select id="gradeFilter" onchange="loadStudents()" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500">
                        <option value="">All Grades</option>
                    </select>

                    <label class="inline-flex items-center cursor-pointer select-none text-sm text-slate-700 font-medium">
                        <input type="checkbox" id="chronicToggle" onchange="loadStudents()" class="sr-only peer">
                        <div class="relative w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-500"></div>
                        <span class="ms-3 font-semibold text-red-600">Chronically Absent Only</span>
                    </label>
                </div>

                <div>
                    <button onclick="exportInterventions()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center">
                        <i class="fa-solid fa-file-excel mr-2"></i> Export Logged Interventions
                    </button>
                </div>
            </div>

            <!-- STUDENTS TABLE -->
            <div class="bg-white rounded-xl shadow overflow-hidden border border-slate-200">
                <div class="px-6 py-4 bg-slate-50 border-b flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Student Roster</h3>
                    <span id="studentStats" class="text-xs font-semibold text-slate-500">Showing 0 students</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 border-b text-xs uppercase font-bold text-slate-600 tracking-wider">
                                <th class="p-4">Student ID</th>
                                <th class="p-4">Name</th>
                                <th class="p-4">Grade</th>
                                <th class="p-4">Days Absent</th>
                                <th class="p-4">Total Days</th>
                                <th class="p-4">Attendance Rate</th>
                                <th class="p-4">Status</th>
                                <th class="p-4 text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-slate-200 text-sm">
                            <tr>
                                <td colspan="8" class="text-center p-8 text-slate-400">Select a school to view student roster.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', checkSession);

        async function checkSession() {
            try {
                const res = await fetch('/me');
                const data = await res.json();
                if (data.logged_in) {
                    currentUser = data.user;
                    setupDashboard();
                } else {
                    showLogin();
                }
            } catch (err) {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
        }

        function setupDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('flex');

            document.getElementById('userEmail').textContent = currentUser.email;
            document.getElementById('userRoleBadge').textContent = currentUser.role;

            if (currentUser.role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                document.getElementById('adminPanel').classList.add('hidden');
            }

            loadSchools();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (res.ok) {
                currentUser = data.user;
                setupDashboard();
            } else {
                const errDiv = document.getElementById('loginError');
                errDiv.textContent = data.error || 'Login failed';
                errDiv.classList.remove('hidden');
            }
        }

        async function logout() {
            await fetch('/logout', { method: 'POST' });
            window.location.reload();
        }

        async function loadSchools() {
            const res = await fetch('/schools');
            const data = await res.json();
            
            const schoolSelect = document.getElementById('schoolSelect');
            const newUserSchool = document.getElementById('newUserSchool');

            schoolSelect.innerHTML = '<option value="">Select a School...</option>';
            newUserSchool.innerHTML = '<option value="">Assign School...</option>';

            data.schools.forEach(s => {
                schoolSelect.innerHTML += `<option value="${s.id}">${s.name}</option>`;
                newUserSchool.innerHTML += `<option value="${s.id}">${s.name}</option>`;
            });

            if (data.schools.length > 0) {
                schoolSelect.value = data.schools[0].id;
                loadStudents();
            }
        }

        async function handleAddSchool(e) {
            e.preventDefault();
            const name = document.getElementById('newSchoolName').value;
            const res = await fetch('/admin/schools', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            if (res.ok) {
                document.getElementById('newSchoolName').value = '';
                loadSchools();
                alert('School created successfully!');
            } else {
                const data = await res.json();
                alert(data.error || 'Failed to create school');
            }
        }

        async function handleAddUser(e) {
            e.preventDefault();
            const email = document.getElementById('newUserEmail').value;
            const password = document.getElementById('newUserPassword').value;
            const role = document.getElementById('newUserRole').value;
            const school_id = document.getElementById('newUserSchool').value;

            const res = await fetch('/admin/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password, role, school_id })
            });

            if (res.ok) {
                document.getElementById('newUserEmail').value = '';
                document.getElementById('newUserPassword').value = '';
                alert('Staff account created successfully!');
            } else {
                const data = await res.json();
                alert(data.error || 'Failed to create user');
            }
        }

        async function loadStudents() {
            const schoolId = document.getElementById('schoolSelect').value;
            if (!schoolId) return;

            const search = document.getElementById('searchInput').value;
            const grade = document.getElementById('gradeFilter').value;
            const chronic = document.getElementById('chronicToggle').checked;

            const url = `/students?school_id=${schoolId}&search=${encodeURIComponent(search)}&grade=${encodeURIComponent(grade)}&chronic=${chronic}`;
            const res = await fetch(url);
            const data = await res.json();

            const tbody = document.getElementById('studentTableBody');
            tbody.innerHTML = '';

            document.getElementById('studentStats').textContent = `Showing ${data.students.length} of ${data.total_students} students (${data.chronic_count} chronic)`;

            if (data.students.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center p-8 text-slate-400">No students match current filters.</td></tr>';
                return;
            }

            data.students.forEach(s => {
                const chronicBadge = s.is_chronic 
                    ? '<span class="bg-red-100 text-red-800 font-bold text-xs px-2.5 py-0.5 rounded-full">Chronically Absent</span>' 
                    : '<span class="bg-green-100 text-green-800 font-semibold text-xs px-2.5 py-0.5 rounded-full">On Track</span>';

                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 font-mono font-medium text-slate-700">${s.student_id}</td>
                        <td class="p-4 font-semibold text-slate-900">${s.student_name}</td>
                        <td class="p-4">${s.grade}</td>
                        <td class="p-4 font-bold text-red-600">${s.days_absent}</td>
                        <td class="p-4">${s.total_days}</td>
                        <td class="p-4 font-bold">${s.attendance_rate_pct}%</td>
                        <td class="p-4">${chronicBadge}</td>
                        <td class="p-4 text-center">
                            <button onclick="alert('Student ID: ${s.student_id}')" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-semibold px-3 py-1.5 rounded transition border border-indigo-200">
                                Log Action
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function handleFileUpload(e) {
            e.preventDefault();
            const schoolId = document.getElementById('schoolSelect').value;
            if (!schoolId) return alert('Please select a school first!');

            const fileInput = document.getElementById('csvFile');
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('school_id', schoolId);

            const res = await fetch('/upload', {
                method: 'POST',
                body: formData
            });

            const data = await res.json();
            if (res.ok) {
                alert(data.message);
                loadStudents();
            } else {
                alert(data.error || 'Upload failed');
            }
        }

        function exportInterventions() {
            const schoolId = document.getElementById('schoolSelect').value;
            if (!schoolId) return alert('Please select a school first!');
            window.location.href = `/export/interventions?school_id=${schoolId}`;
        }
    </script>
</body>
</html>
